<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1204" viewBox="0 0 1000 1204" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Three tiers, one rule</title><desc id="d">A diagram of Bonsai&#x27;s three tiers, stacked. Edge, where you work: your phone, car or voice assistant, and Claude Code, Codex and Copilot, which search and read the vault and leave notes in their own inbox. Private compute, hardware you own: capture, the night job and profile, local search models, the vault itself, and the gateway, the only door out. Cloud: Google Drive keeps the vault in sync, and cloud agents like ChatGPT ask the gateway one question at a time and get short answers with citations, never raw chats.</desc><rect x="0.5" y="0.5" width="999" height="1204" rx="20" fill="#FBF9F4" stroke="#E4DED0"/><text x="32.0" y="62.0" font-size="30" fill="#1F2328" font-weight="700" text-anchor="start">Three tiers, one rule</text><text x="32.0" y="92.0" font-size="15.5" fill="#59636E" text-anchor="start">Split the way Apple Intelligence splits on-device, private cloud and third-party work. The closer a tier sits to the open</text><text x="32.0" y="114.0" font-size="15.5" fill="#59636E" text-anchor="start">internet, the less of you it gets to see.</text><circle cx="45" cy="156" r="13" fill="#FFFFFF" stroke="#5E4BA8" stroke-width="1.6"/><path d="M45 148.5 Q46.6 154.4 52.5 156 Q46.6 157.6 45 163.5 Q43.4 157.6 37.5 156 Q43.4 154.4 45 148.5Z" fill="#5E4BA8"/><text x="64.0" y="160.5" font-size="13" fill="#59636E" text-anchor="start">AI · on your own GPU</text><circle cx="238.50296875" cy="156" r="13" fill="#FFFFFF" stroke="#23704F" stroke-width="1.6"/><path d="M235.50296875 151 L231.00296875 156 L235.50296875 161 M241.50296875 151 L246.00296875 156 L241.50296875 161" fill="none" stroke="#23704F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="257.5" y="160.5" font-size="13" fill="#59636E" text-anchor="start">Plain code · no AI</text><circle cx="405.48796875000005" cy="156" r="13" fill="#FFFFFF" stroke="#245FA8" stroke-width="1.6"/><rect x="398.98796875000005" y="151" width="13" height="8.5" rx="1.5" fill="none" stroke="#245FA8" stroke-width="1.8"/><path d="M396.98796875000005 162 H413.98796875000005" stroke="#245FA8" stroke-width="1.8" stroke-linecap="round"/><text x="424.5" y="160.5" font-size="13" fill="#59636E" text-anchor="start">Your everyday agents</text><circle cx="599.9496875" cy="156" r="13" fill="#FFFFFF" stroke="#7A6440" stroke-width="1.6"/><path d="M592.9496875 160.5 H606.4496875 A3.6 3.6 0 0 0 605.4496875 153.4 A5 5 0 0 0 596.4496875 153 A3.8 3.8 0 0 0 592.9496875 160.5Z" fill="#7A6440"/><text x="618.9" y="160.5" font-size="13" fill="#59636E" text-anchor="start">Cloud storage</text><rect x="32" y="192" width="936" height="227.5" rx="16" fill="#EEF3FA"/><text x="50.0" y="222.0" font-size="13" fill="#245FA8" font-weight="700" letter-spacing="1" text-anchor="start">EDGE</text><text x="240.0" y="222.0" font-size="13.5" fill="#59636E" text-anchor="start">Where you work. It reads context and leaves notes, and runs no jobs.</text><rect x="50.0" y="249" width="288.0" height="152.5" rx="12" fill="#FFF3D6" stroke="#9A5B00" stroke-opacity="0.35" stroke-width="1.2"/><circle cx="79.0" cy="276" r="13" fill="#FFFFFF" stroke="#9A5B00" stroke-width="1.6"/><circle cx="79.0" cy="272.8" r="3.4" fill="#9A5B00"/><path d="M72.5 283.5 Q79.0 274.5 85.5 283.5Z" fill="#9A5B00"/><text x="100.0" y="280.0" font-size="16" fill="#1F2328" font-weight="700" text-anchor="start">You</text><text x="100.0" y="299.0" font-size="11.5" fill="#9A5B00" font-weight="700" letter-spacing="0.6" text-anchor="start">YOU</text><text x="66.0" y="325.0" font-size="14" fill="#2D333B" text-anchor="start">Work the way you already do. The</text><text x="66.0" y="344.5" font-size="14" fill="#2D333B" text-anchor="start">context comes along with you.</text><rect x="356.0" y="249" width="288.0" height="152.5" rx="12" fill="#E8F0FB" stroke="#245FA8" stroke-opacity="0.35" stroke-width="1.2"/><circle cx="385.0" cy="276" r="13" fill="#FFFFFF" stroke="#245FA8" stroke-width="1.6"/><rect x="378.5" y="271" width="13" height="8.5" rx="1.5" fill="none" stroke="#245FA8" stroke-width="1.8"/><path d="M376.5 282 H393.5" stroke="#245FA8" stroke-width="1.8" stroke-linecap="round"/><text x="406.0" y="280.0" font-size="16" fill="#1F2328" font-weight="700" text-anchor="start">Phone, car, voice</text><text x="406.0" y="299.0" font-size="11.5" fill="#245FA8" font-weight="700" letter-spacing="0.6" text-anchor="start">YOUR EVERYDAY AGENTS</text><text x="372.0" y="325.0" font-size="14" fill="#2D333B" text-anchor="start">Wherever you work next picks up</text><text x="372.0" y="344.5" font-size="14" fill="#2D333B" text-anchor="start">the same context, so nothing starts</text><text x="372.0" y="364.0" font-size="14" fill="#2D333B" text-anchor="start">from scratch.</text><rect x="662.0" y="249" width="288.0" height="152.5" rx="12" fill="#E8F0FB" stroke="#245FA8" stroke-opacity="0.35" stroke-width="1.2"/><circle cx="691.0" cy="276" r="13" fill="#FFFFFF" stroke="#245FA8" stroke-width="1.6"/><rect x="684.5" y="271" width="13" height="8.5" rx="1.5" fill="none" stroke="#245FA8" stroke-width="1.8"/><path d="M682.5 282 H699.5" stroke="#245FA8" stroke-width="1.8" stroke-linecap="round"/><text x="712.0" y="280.0" font-size="16" fill="#1F2328" font-weight="700" text-anchor="start">Claude Code, Codex,</text><text x="712.0" y="300.0" font-size="16" fill="#1F2328" font-weight="700" text-anchor="start">Copilot</text><text x="712.0" y="319.0" font-size="11.5" fill="#245FA8" font-weight="700" letter-spacing="0.6" text-anchor="start">YOUR EVERYDAY AGENTS</text><text x="678.0" y="345.0" font-size="14" fill="#2D333B" text-anchor="start">Search and read the vault while</text><text x="678.0" y="364.5" font-size="14" fill="#2D333B" text-anchor="start">they work, and leave notes in their</text><text x="678.0" y="384.0" font-size="14" fill="#2D333B" text-anchor="start">own inbox folder.</text><rect x="32" y="481.5" width="936" height="357.5" rx="16" fill="#ECF5EF"/><text x="50.0" y="511.5" font-size="13" fill="#23704F" font-weight="700" letter-spacing="1" text-anchor="start">PRIVATE COMPUTE</text><text x="240.0" y="511.5" font-size="13.5" fill="#59636E" text-anchor="start">Hardware you own: a PC today, a NAS later. Your raw history lives and gets</text><text x="240.0" y="530.5" font-size="13.5" fill="#59636E" text-anchor="start">read here, and nowhere else.</text><rect x="50.0" y="557.5" width="288.0" height="132.5" rx="12" fill="#E8F4EE" stroke="#23704F" stroke-opacity="0.35" stroke-width="1.2"/><circle cx="79.0" cy="584.5" r="13" fill="#FFFFFF" stroke="#23704F" stroke-width="1.6"/><path d="M76.0 579.5 L71.5 584.5 L76.0 589.5 M82.0 579.5 L86.5 584.5 L82.0 589.5" fill="none" stroke="#23704F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="100.0" y="588.5" font-size="16" fill="#1F2328" font-weight="700" text-anchor="start">Capture</text><text x="100.0" y="607.5" font-size="11.5" fill="#23704F" font-weight="700" letter-spacing="0.6" text-anchor="start">PLAIN CODE · NO AI</text><text x="66.0" y="633.5" font-size="14" fill="#2D333B" text-anchor="start">Copies every new chat in from the</text><text x="66.0" y="653.0" font-size="14" fill="#2D333B" text-anchor="start">tools you use, with keys and</text><text x="66.0" y="672.5" font-size="14" fill="#2D333B" text-anchor="start">passwords scrubbed out.</text><rect x="356.0" y="557.5" width="288.0" height="132.5" rx="12" fill="#F1EEFA" stroke="#5E4BA8" stroke-opacity="0.35" stroke-width="1.2"/><circle cx="385.0" cy="584.5" r="13" fill="#FFFFFF" stroke="#5E4BA8" stroke-width="1.6"/><path d="M385.0 577.0 Q386.6 582.9 392.5 584.5 Q386.6 586.1 385.0 592.0 Q383.4 586.1 377.5 584.5 Q383.4 582.9 385.0 577.0Z" fill="#5E4BA8"/><text x="406.0" y="588.5" font-size="16" fill="#1F2328" font-weight="700" text-anchor="start">Night job and profile</text><text x="406.0" y="607.5" font-size="11.5" fill="#5E4BA8" font-weight="700" letter-spacing="0.6" text-anchor="start">AI · ON YOUR OWN GPU</text><text x="372.0" y="633.5" font-size="14" fill="#2D333B" text-anchor="start">Learns from your chats while you</text><text x="372.0" y="653.0" font-size="14" fill="#2D333B" text-anchor="start">sleep, and proposes changes for</text><text x="372.0" y="672.5" font-size="14" fill="#2D333B" text-anchor="start">you to approve.</text><rect x="50.0" y="708.0" width="288.0" height="113.0" rx="12" fill="#3B4A3F"/><text x="68.0" y="742.0" font-size="18" fill="#FFFFFF" font-weight="700" text-anchor="start">The vault</text><text x="68.0" y="768.0" font-size="14" fill="#E6ECE7" text-anchor="start">Plain markdown notes: the one</text><text x="68.0" y="787.5" font-size="14" fill="#E6ECE7" text-anchor="start">store everything reads from.</text><rect x="356.0" y="708.0" width="288.0" height="113.0" rx="12" fill="#F1EEFA" stroke="#5E4BA8" stroke-opacity="0.35" stroke-width="1.2"/><circle cx="385.0" cy="735.0" r="13" fill="#FFFFFF" stroke="#5E4BA8" stroke-width="1.6"/><path d="M385.0 727.5 Q386.6 733.4 392.5 735.0 Q386.6 736.6 385.0 742.5 Q383.4 736.6 377.5 735.0 Q383.4 733.4 385.0 727.5Z" fill="#5E4BA8"/><text x="406.0" y="739.0" font-size="16" fill="#1F2328" font-weight="700" text-anchor="start">Search</text><text x="406.0" y="758.0" font-size="11.5" fill="#5E4BA8" font-weight="700" letter-spacing="0.6" text-anchor="start">AI · ON YOUR OWN GPU</text><text x="372.0" y="784.0" font-size="14" fill="#2D333B" text-anchor="start">Finds notes by meaning, with</text><text x="372.0" y="803.5" font-size="14" fill="#2D333B" text-anchor="start">models running on your own GPU.</text><rect x="662.0" y="557.5" width="288.0" height="263.5" rx="12" fill="#E8F4EE" stroke="#23704F" stroke-opacity="0.35" stroke-width="1.2"/><circle cx="691.0" cy="584.5" r="13" fill="#FFFFFF" stroke="#23704F" stroke-width="1.6"/><path d="M688.0 579.5 L683.5 584.5 L688.0 589.5 M694.0 579.5 L698.5 584.5 L694.0 589.5" fill="none" stroke="#23704F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="712.0" y="588.5" font-size="16" fill="#1F2328" font-weight="700" text-anchor="start">Gateway</text><text x="712.0" y="607.5" font-size="11.5" fill="#23704F" font-weight="700" letter-spacing="0.6" text-anchor="start">PLAIN CODE · NO AI</text><text x="678.0" y="633.5" font-size="14" fill="#2D333B" text-anchor="start">The only door out. Your own trusted</text><text x="678.0" y="653.0" font-size="14" fill="#2D333B" text-anchor="start">agents get search and read.</text><text x="678.0" y="672.5" font-size="14" fill="#2D333B" text-anchor="start">Everyone else gets one question at</text><text x="678.0" y="692.0" font-size="14" fill="#2D333B" text-anchor="start">a time, ask(question, purpose), and</text><text x="678.0" y="711.5" font-size="14" fill="#2D333B" text-anchor="start">a short answer with citations.</text><rect x="32" y="901.0" width="936" height="227.5" rx="16" fill="#F7F2E8"/><text x="50.0" y="931.0" font-size="13" fill="#7A6440" font-weight="700" letter-spacing="1" text-anchor="start">CLOUD</text><text x="240.0" y="931.0" font-size="13.5" fill="#59636E" text-anchor="start">Really useful, so it gets the smallest slice it needs.</text><rect x="50.0" y="958.0" width="288.0" height="152.5" rx="12" fill="#FBF5EA" stroke="#7A6440" stroke-opacity="0.35" stroke-width="1.2"/><circle cx="79.0" cy="985.0" r="13" fill="#FFFFFF" stroke="#7A6440" stroke-width="1.6"/><path d="M72.0 989.5 H85.5 A3.6 3.6 0 0 0 84.5 982.4 A5 5 0 0 0 75.5 982.0 A3.8 3.8 0 0 0 72.0 989.5Z" fill="#7A6440"/><text x="100.0" y="989.0" font-size="16" fill="#1F2328" font-weight="700" text-anchor="start">Google Drive</text><text x="100.0" y="1008.0" font-size="11.5" fill="#7A6440" font-weight="700" letter-spacing="0.6" text-anchor="start">CLOUD STORAGE</text><text x="66.0" y="1034.0" font-size="14" fill="#2D333B" text-anchor="start">Keeps the vault in sync between</text><text x="66.0" y="1053.5" font-size="14" fill="#2D333B" text-anchor="start">your computers.</text><rect x="662.0" y="958.0" width="288.0" height="152.5" rx="12" fill="#E8F0FB" stroke="#245FA8" stroke-opacity="0.35" stroke-width="1.2"/><circle cx="691.0" cy="985.0" r="13" fill="#FFFFFF" stroke="#245FA8" stroke-width="1.6"/><rect x="684.5" y="980.0" width="13" height="8.5" rx="1.5" fill="none" stroke="#245FA8" stroke-width="1.8"/><path d="M682.5 991.0 H699.5" stroke="#245FA8" stroke-width="1.8" stroke-linecap="round"/><text x="712.0" y="989.0" font-size="16" fill="#1F2328" font-weight="700" text-anchor="start">ChatGPT and other</text><text x="712.0" y="1009.0" font-size="16" fill="#1F2328" font-weight="700" text-anchor="start">cloud agents</text><text x="712.0" y="1028.0" font-size="11.5" fill="#245FA8" font-weight="700" letter-spacing="0.6" text-anchor="start">AGENTS IN THE CLOUD</text><text x="678.0" y="1054.0" font-size="14" fill="#2D333B" text-anchor="start">Ask through the gateway&#x27;s one</text><text x="678.0" y="1073.5" font-size="14" fill="#2D333B" text-anchor="start">door, and get answers back, never</text><text x="678.0" y="1093.0" font-size="14" fill="#2D333B" text-anchor="start">your raw chats.</text><path d="M806.0 405.5 V547.5" stroke="#3B4A3F" stroke-width="1.8"/><path d="M801.0 545.5 L806.0 553.5 L811.0 545.5" fill="none" stroke="#3B4A3F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M801.0 413.5 L806.0 405.5 L811.0 413.5" fill="none" stroke="#3B4A3F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="792.0" y="455.5" font-size="13" fill="#3B4A3F" font-weight="700" text-anchor="end">search, read, notes into their inbox</text><path d="M806.0 825.0 V948.0" stroke="#3B4A3F" stroke-width="1.8"/><path d="M801.0 946.0 L806.0 954.0 L811.0 946.0" fill="none" stroke="#3B4A3F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M801.0 833.0 L806.0 825.0 L811.0 833.0" fill="none" stroke="#3B4A3F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="792.0" y="875.0" font-size="13" fill="#3B4A3F" font-weight="700" text-anchor="end">a question in, a short answer out</text><path d="M194.0 825.0 V948.0" stroke="#3B4A3F" stroke-width="1.8"/><path d="M189.0 946.0 L194.0 954.0 L199.0 946.0" fill="none" stroke="#3B4A3F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M189.0 833.0 L194.0 825.0 L199.0 833.0" fill="none" stroke="#3B4A3F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="208.0" y="875.0" font-size="13" fill="#3B4A3F" font-weight="700" text-anchor="start">kept in sync</text><text x="500.0" y="1174.5" font-size="15" fill="#3B4A3F" font-weight="700" text-anchor="middle">Raw material stays on hardware you own. Answers are what travel.</text></svg>
