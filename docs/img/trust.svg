<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1118" viewBox="0 0 1000 1118" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">How a claim about you earns its place</title><desc id="d">A flow diagram of the profile checks. Step 1, Claude extracts claims about you, each with your exact words. Step 2, plain code drops any claim whose quote isn&#x27;t word for word in your own message. Step 3, plain code drops hunches with fewer than two chats behind them, guesses at motives or feelings, and anything on your rejected or private lists. Step 4, a separate Claude call that never saw step 1 drops anything it can&#x27;t support. What survives becomes facts written up by code and questions for you, and it all goes to a drafts folder, never straight into your profile. Code, not a model, sets each claim&#x27;s date, confidence and privacy label.</desc><rect x="0.5" y="0.5" width="999" height="1118" rx="20" fill="#FBF9F4" stroke="#E4DED0"/><text x="32.0" y="62.0" font-size="30" fill="#1F2328" font-weight="700" text-anchor="start">How a claim about you earns its place</text><text x="32.0" y="92.0" font-size="15.5" fill="#59636E" text-anchor="start">Models make up a lot about people, and their own self-checks miss it. So every claim has to get past plain code and a</text><text x="32.0" y="114.0" font-size="15.5" fill="#59636E" text-anchor="start">second, separate model before you ever see it.</text><rect x="72" y="158" width="560" height="113.0" rx="12" fill="#FCEEE8" stroke="#B4472A" stroke-opacity="0.35" stroke-width="1.2"/><circle cx="101" cy="185" r="13" fill="#FFFFFF" stroke="#B4472A" stroke-width="1.6"/><path d="M101 177.5 Q102.6 183.4 108.5 185 Q102.6 186.6 101 192.5 Q99.4 186.6 93.5 185 Q99.4 183.4 101 177.5Z" fill="#B4472A"/><text x="122.0" y="189.0" font-size="16" fill="#1F2328" font-weight="700" text-anchor="start">1. Claim extractor</text><text x="122.0" y="208.0" font-size="11.5" fill="#B4472A" font-weight="700" letter-spacing="0.6" text-anchor="start">AI · CLAUDE</text><text x="88.0" y="234.0" font-size="14" fill="#2D333B" text-anchor="start">Reads one month of your chats and writes claims about you, each with</text><text x="88.0" y="253.5" font-size="14" fill="#2D333B" text-anchor="start">the exact words of yours it&#x27;s based on.</text><path d="M352.0 275.0 V293.0" stroke="#8C959F" stroke-width="1.8"/><path d="M347.0 291.0 L352.0 299.0 L357.0 291.0" fill="none" stroke="#8C959F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="72" y="301.0" width="560" height="113.0" rx="12" fill="#E8F4EE" stroke="#23704F" stroke-opacity="0.35" stroke-width="1.2"/><circle cx="101" cy="328.0" r="13" fill="#FFFFFF" stroke="#23704F" stroke-width="1.6"/><path d="M98 323.0 L93.5 328.0 L98 333.0 M104 323.0 L108.5 328.0 L104 333.0" fill="none" stroke="#23704F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="122.0" y="332.0" font-size="16" fill="#1F2328" font-weight="700" text-anchor="start">2. Quote checker</text><text x="122.0" y="351.0" font-size="11.5" fill="#23704F" font-weight="700" letter-spacing="0.6" text-anchor="start">PLAIN CODE · NO AI</text><text x="88.0" y="377.0" font-size="14" fill="#2D333B" text-anchor="start">Is every quote word for word in a message you wrote, in the chat it</text><text x="88.0" y="396.5" font-size="14" fill="#2D333B" text-anchor="start">names? One bad quote and the whole claim goes.</text><path d="M636 357.5 H694" stroke="#B9B2A3" stroke-width="1.8" stroke-dasharray="5 4"/><path d="M688 352.5 L696 357.5 L688 362.5" fill="none" stroke="#B9B2A3" stroke-width="1.8" stroke-linecap="round"/><rect x="702" y="335.5" width="258" height="44" rx="22" fill="#F2EFE8" stroke="#D9D2C3"/><text x="722.0" y="356.5" font-size="14" fill="#6E675A" font-weight="700" text-anchor="start">Quote not found</text><text x="722.0" y="372.5" font-size="12" fill="#8A8273" text-anchor="start">dropped, and the reason kept</text><path d="M352.0 418.0 V436.0" stroke="#8C959F" stroke-width="1.8"/><path d="M347.0 434.0 L352.0 442.0 L357.0 434.0" fill="none" stroke="#8C959F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="72" y="444.0" width="560" height="132.5" rx="12" fill="#E8F4EE" stroke="#23704F" stroke-opacity="0.35" stroke-width="1.2"/><circle cx="101" cy="471.0" r="13" fill="#FFFFFF" stroke="#23704F" stroke-width="1.6"/><path d="M98 466.0 L93.5 471.0 L98 476.0 M104 466.0 L108.5 471.0 L104 476.0" fill="none" stroke="#23704F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="122.0" y="475.0" font-size="16" fill="#1F2328" font-weight="700" text-anchor="start">3. Rule checks</text><text x="122.0" y="494.0" font-size="11.5" fill="#23704F" font-weight="700" letter-spacing="0.6" text-anchor="start">PLAIN CODE · NO AI</text><text x="88.0" y="520.0" font-size="14" fill="#2D333B" text-anchor="start">A hunch needs two or more separate chats, and can&#x27;t guess at motives or</text><text x="88.0" y="539.5" font-size="14" fill="#2D333B" text-anchor="start">feelings. Nothing you&#x27;ve rejected before, and no topic you&#x27;ve asked it to</text><text x="88.0" y="559.0" font-size="14" fill="#2D333B" text-anchor="start">leave out.</text><path d="M636 510.25 H694" stroke="#B9B2A3" stroke-width="1.8" stroke-dasharray="5 4"/><path d="M688 505.25 L696 510.25 L688 515.25" fill="none" stroke="#B9B2A3" stroke-width="1.8" stroke-linecap="round"/><rect x="702" y="488.25" width="258" height="44" rx="22" fill="#F2EFE8" stroke="#D9D2C3"/><text x="722.0" y="509.2" font-size="14" fill="#6E675A" font-weight="700" text-anchor="start">Breaks a rule</text><text x="722.0" y="525.2" font-size="12" fill="#8A8273" text-anchor="start">dropped, and the reason kept</text><path d="M352.0 580.5 V598.5" stroke="#8C959F" stroke-width="1.8"/><path d="M347.0 596.5 L352.0 604.5 L357.0 596.5" fill="none" stroke="#8C959F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="72" y="606.5" width="560" height="113.0" rx="12" fill="#FCEEE8" stroke="#B4472A" stroke-opacity="0.35" stroke-width="1.2"/><circle cx="101" cy="633.5" r="13" fill="#FFFFFF" stroke="#B4472A" stroke-width="1.6"/><path d="M101 626.0 Q102.6 631.9 108.5 633.5 Q102.6 635.1 101 641.0 Q99.4 635.1 93.5 633.5 Q99.4 631.9 101 626.0Z" fill="#B4472A"/><text x="122.0" y="637.5" font-size="16" fill="#1F2328" font-weight="700" text-anchor="start">4. Fact-checker</text><text x="122.0" y="656.5" font-size="11.5" fill="#B4472A" font-weight="700" letter-spacing="0.6" text-anchor="start">AI · CLAUDE, A SEPARATE CALL</text><text x="88.0" y="682.5" font-size="14" fill="#2D333B" text-anchor="start">A separate call that never saw step 1. It sees the claims and your</text><text x="88.0" y="702.0" font-size="14" fill="#2D333B" text-anchor="start">messages, and marks each one supported, unsupported or invented.</text><path d="M636 663.0 H694" stroke="#B9B2A3" stroke-width="1.8" stroke-dasharray="5 4"/><path d="M688 658.0 L696 663.0 L688 668.0" fill="none" stroke="#B9B2A3" stroke-width="1.8" stroke-linecap="round"/><rect x="702" y="641.0" width="258" height="44" rx="22" fill="#F2EFE8" stroke="#D9D2C3"/><text x="722.0" y="662.0" font-size="14" fill="#6E675A" font-weight="700" text-anchor="start">Not supported</text><text x="722.0" y="678.0" font-size="12" fill="#8A8273" text-anchor="start">dropped, and the reason kept</text><path d="M352.0 719.5 V733.5 M207.0 733.5 H497.0" stroke="#8C959F" stroke-width="1.8" fill="none"/><path d="M207.0 733.5 V741.5" stroke="#8C959F" stroke-width="1.8"/><path d="M202.0 739.5 L207.0 747.5 L212.0 739.5" fill="none" stroke="#8C959F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="72.0" y="749.5" width="270.0" height="132.5" rx="12" fill="#E8F4EE" stroke="#23704F" stroke-opacity="0.35" stroke-width="1.2"/><circle cx="101.0" cy="776.5" r="13" fill="#FFFFFF" stroke="#23704F" stroke-width="1.6"/><path d="M98.0 771.5 L93.5 776.5 L98.0 781.5 M104.0 771.5 L108.5 776.5 L104.0 781.5" fill="none" stroke="#23704F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="122.0" y="780.5" font-size="16" fill="#1F2328" font-weight="700" text-anchor="start">Facts</text><text x="122.0" y="799.5" font-size="11.5" fill="#23704F" font-weight="700" letter-spacing="0.6" text-anchor="start">PLAIN CODE · NO AI</text><text x="88.0" y="825.5" font-size="14" fill="#2D333B" text-anchor="start">Written up by code, not by a</text><text x="88.0" y="845.0" font-size="14" fill="#2D333B" text-anchor="start">model, with a link to every chat</text><text x="88.0" y="864.5" font-size="14" fill="#2D333B" text-anchor="start">behind them.</text><path d="M497.0 733.5 V741.5" stroke="#8C959F" stroke-width="1.8"/><path d="M492.0 739.5 L497.0 747.5 L502.0 739.5" fill="none" stroke="#8C959F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="362.0" y="749.5" width="270.0" height="152.0" rx="12" fill="#FCEEE8" stroke="#B4472A" stroke-opacity="0.35" stroke-width="1.2"/><circle cx="391.0" cy="776.5" r="13" fill="#FFFFFF" stroke="#B4472A" stroke-width="1.6"/><path d="M391.0 769.0 Q392.6 774.9 398.5 776.5 Q392.6 778.1 391.0 784.0 Q389.4 778.1 383.5 776.5 Q389.4 774.9 391.0 769.0Z" fill="#B4472A"/><text x="412.0" y="780.5" font-size="16" fill="#1F2328" font-weight="700" text-anchor="start">Questions</text><text x="412.0" y="799.5" font-size="11.5" fill="#B4472A" font-weight="700" letter-spacing="0.6" text-anchor="start">AI · CLAUDE</text><text x="378.0" y="825.5" font-size="14" fill="#2D333B" text-anchor="start">Hunches come back as a few</text><text x="378.0" y="845.0" font-size="14" fill="#2D333B" text-anchor="start">questions that quote you,</text><text x="378.0" y="864.5" font-size="14" fill="#2D333B" text-anchor="start">checked again so none of them</text><text x="378.0" y="884.0" font-size="14" fill="#2D333B" text-anchor="start">lead you.</text><path d="M207.0 886.0 V915.5 M497.0 905.5 V915.5 M207.0 915.5 H497.0" stroke="#8C959F" stroke-width="1.8" fill="none"/><path d="M352.0 915.5 V923.5" stroke="#8C959F" stroke-width="1.8"/><path d="M347.0 921.5 L352.0 929.5 L357.0 921.5" fill="none" stroke="#8C959F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="72" y="931.5" width="560" height="113.0" rx="12" fill="#FFF3D6" stroke="#9A5B00" stroke-opacity="0.35" stroke-width="1.2"/><circle cx="101" cy="958.5" r="13" fill="#FFFFFF" stroke="#9A5B00" stroke-width="1.6"/><circle cx="101" cy="955.3" r="3.4" fill="#9A5B00"/><path d="M94.5 966.0 Q101 957.0 107.5 966.0Z" fill="#9A5B00"/><text x="122.0" y="962.5" font-size="16" fill="#1F2328" font-weight="700" text-anchor="start">You</text><text x="122.0" y="981.5" font-size="11.5" fill="#9A5B00" font-weight="700" letter-spacing="0.6" text-anchor="start">YOUR CALL</text><text x="88.0" y="1007.5" font-size="14" fill="#2D333B" text-anchor="start">Everything lands in a drafts folder for you to read. The job is never</text><text x="88.0" y="1027.0" font-size="14" fill="#2D333B" text-anchor="start">allowed to write into your profile.</text><text x="500.0" y="1088.5" font-size="15" fill="#3B4A3F" font-weight="700" text-anchor="middle">Code sets each claim&#x27;s date, confidence and privacy label. A model never does.</text></svg>
