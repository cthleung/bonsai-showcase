name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # setup-python's macOS build can't load SQLite extensions, which sqlite-vec needs, so macOS
      # uses uv's own Python build instead. Windows is fine with setup-python.
      - if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: runner.os == 'macOS'
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          activate-environment: true
        env:
          UV_PYTHON_PREFERENCE: only-managed
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install -r requirements.txt
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: uv pip install -r requirements.txt
      - name: Check that sqlite3 can load extensions
        run: python -c "import sqlite3, sys; sys.exit(0 if hasattr(sqlite3.connect(':memory:'), 'enable_load_extension') else 'this Python has no sqlite3 enable_load_extension, which sqlite-vec needs')"
      - name: Run the tests
        run: python -m pytest
